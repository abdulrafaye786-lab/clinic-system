<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="favCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="#818cf8" stroke-width="1.8" />
  
  <!-- Orbit Ring -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.6" transform="rotate(-30 32 32)" stroke-dasharray="30 10" opacity="0.8" />
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#a855f7" stroke-width="1.6" transform="rotate(30 32 32)" stroke-dasharray="25 15" opacity="0.8" />

  <!-- Central Futuristic Cross -->
  <rect x="28" y="18" width="8" height="28" rx="4" fill="url(#favCross)" />
  <rect x="18" y="28" width="28" height="8" rx="4" fill="url(#favCross)" />
  
  <!-- Core Diamond & Quantum Dot -->
  <rect x="26" y="26" width="12" height="12" rx="2.5" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
