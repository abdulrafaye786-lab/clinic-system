<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="futuristic-clinic-logo" width="100%" height="100%">
  <defs>
    <!-- Background & Sphere Gradients: Quantum Cyber Obsidian -->
    <radialGradient id="futuristicBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="60%" stop-color="#081220" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>

    <!-- Glowing Core Gradient: Electric Cyan into Laser Neon Indigo -->
    <linearGradient id="coreCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Orbital Ring 1 Gradient: Neon Hologram Cyan & Cyber Mint -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.95" />
    </linearGradient>

    <!-- Orbital Ring 2 Gradient: Cyber Mint into Hologram Violet -->
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Rounded Hex Shield Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#futuristicBgGrad)" stroke="rgba(0, 242, 254, 0.45)" stroke-width="1.8" />

  <!-- Outer Cyber Tech Marks -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" stroke-dasharray="3 7" class="cyber-radar-ring" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="rgba(0, 245, 160, 0.25)" stroke-width="0.75" />

  <!-- Orbit 1 (Clockwise Gyroscope) -->
  <g class="orbit-layer orbit-1">
    <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.2" stroke-dasharray="45 15 25 15" filter="url(#subtleGlow)" />
    <!-- Traveling Data Quantum Node 1 -->
    <circle cx="84" cy="50" r="2.8" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="16" cy="50" r="2" fill="#00f5a0" filter="url(#neonGlow)" />
  </g>

  <!-- Orbit 2 (Counter-Clockwise Gyroscope at 60deg) -->
  <g class="orbit-layer orbit-2">
    <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="url(#orbitGrad2)" stroke-width="2" stroke-dasharray="50 20 30 10" filter="url(#subtleGlow)" />
    <!-- Traveling Data Quantum Node 2 -->
    <circle cx="84" cy="50" r="2.6" fill="#a855f7" filter="url(#neonGlow)" />
  </g>

  <!-- Central Futuristic Holographic Medical Cross with Core Pulse -->
  <g class="hologram-cross-group" transform="translate(50, 50)">
    <!-- Ambient Core Aura -->
    <circle cx="0" cy="0" r="16" fill="url(#coreCrossGrad)" opacity="0.3" filter="url(#neonGlow)" class="core-aura-pulse" />

    <!-- Isometric / Futuristic Cross Arms -->
    <!-- Vertical Arm -->
    <rect x="-5" y="-19" width="10" height="38" rx="5" fill="url(#coreCrossGrad)" filter="url(#subtleGlow)" />
    <!-- Horizontal Arm -->
    <rect x="-19" y="-5" width="38" height="10" rx="5" fill="url(#coreCrossGrad)" filter="url(#subtleGlow)" />

    <!-- Inner High-Tech Diamond Cut Center -->
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="3.5" fill="#070c18" stroke="#00f2fe" stroke-width="1.6" />
    
    <!-- Central Bio-Heartbeat / Neural Quantum Node -->
    <circle cx="0" cy="0" r="4.2" fill="#ffffff" filter="url(#neonGlow)" class="quantum-heart-pulse" />
    
    <!-- Micro ECG Signal Polyline across core -->
    <path d="M -15,0 L -7,0 L -4,-6 L 0,7 L 4,-5 L 7,0 L 15,0" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" class="ecg-pulse-line" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 16,24 L 16,16 L 24,16" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 84,24 L 84,16 L 76,16" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 16,76 L 16,84 L 24,84" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 84,76 L 84,84 L 76,84" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
</svg>

